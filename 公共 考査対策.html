if(qz.r!=null){const A=`答え: <b>${esc(dsp(q.a))}</b> ${bd(q.s)}${q.n?`<br><span class="mt">${esc(q.n)}</span>`:''}`;
if(qz.ok==null)h+=`<div class="fb">${A}</div><div class="row"><button onclick="rec(false)">❌ 間違えた</button><button class="pri" onclick="rec(true)">⭕ 合っていた</button></div>`;
else h+=`<div class="fb">${qz.ok?'⭕ 正解':'❌ 不正解'}${t&&!g&&qz.r?`<br>あなたの答え: ${esc(qz.r)}`:''}<br>${A}</div><div class="row">${!qz.ok&&t&&!g&&qz.r?`<button onclick="fix()">自分は合っていた(正解にする)</button>`:''}<button class="pri" onclick="qz.i++;if(qz.i<qz.list.length)nq();draw()">次へ</button></div>`}
return h}
function sq(m){const p=pool();if(!p.length)return;qz={mode:m,list:sh(p).slice(0,10),i:0,sc:0,wr:[]};nq();draw()}
function rec(ok){if(qz.ok!=null)return;const q=qz.list[qz.i];qz.ok=ok;if(ok){qz.sc++;st[q.id]=1}else{qz.wr.push(q);st[q.id]=0}save();draw()}
function fix(){const q=qz.list[qz.i];if(qz.ok!==false)return;qz.wr=qz.wr.filter(x=>x!==q);qz.sc++;st[q.id]=1;qz.ok=true;save();draw()}
function ans(i){if(qz.r!=null)return;qz.r=qz.o[i];rec(qz.r==qz.list[qz.i].a)}function ansT(){if(qz.r!=null)return;const v=$('#ti').value;if(!v.trim())return;qz.r=v;rec(okA(v,qz.list[qz.i].a))}
function vList(){const kw=(window._kw||'').toLowerCase();let h=fbar()+`<div class="bar"><input style="flex:1" placeholder="🔍 検索" value="${esc(window._kw||'')}" oninput="window._kw=this.value;clearTimeout(window._t);window._t=setTimeout(draw,300)"><button class="pri" onclick="addC()">＋追加</button></div>`;
const l=pool().filter(x=>!kw||(x.q+x.a+x.n).toLowerCase().includes(kw));h+=`<p class="mt">${l.length}件(「未習得のみ」は未習得で絞込)</p>`;
return h+l.map(x=>ed==x.id?`<div class="it"><select onchange="up('${x.id}','c',this.value)">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${x.c==k?'selected':''}>${v}</option>`).join('')}</select><textarea rows="2" placeholder="問題" oninput="up('${x.id}','q',this.value,1)">${esc(x.q)}</textarea><input placeholder="答え(別解は / 区切り)" value="${esc(x.a)}" oninput="up('${x.id}','a',this.value,1)"><input placeholder="メモ" value="${esc(x.n)}" oninput="up('${x.id}','n',this.value,1)"><select onchange="up('${x.id}','s',this.value)"><option value="p" ${x.s=='p'?'selected':''}>出典: プリント</option><option value="s" ${x.s=='s'?'selected':''}>出典: 補完</option></select><div class="row"><button class="pri" onclick="ed=null;draw()">完了</button><button onclick="if(confirm('削除しますか?')){cards=cards.filter(y=>y.id!='${x.id}');ed=null;save();draw()}">削除</button></div></div>`
:`<div class="it" onclick="ed='${x.id}';draw()"><span class="mt">${CATS[x.c]}</span> ${bd(x.s)} ${st[x.id]===1?'✅':''}<br>${esc(x.q)}<br><span class="a">${esc(dsp(x.a))}</span>${x.n?`<br><span class="mt">${esc(x.n)}</span>`:''}</div>`).join('')}
function up(id,k,v,q){const c=cards.find(x=>x.id==id);c[k]=v;save();if(!q)draw()}
function addC(){const id='n'+Date.now();cards.unshift({id,c:f.c||'r',q:'',a:'',s:'p',n:''});ed=id;save();draw()}
function vProg(){const k=cards.filter(x=>st[x.id]===1).length;let h=`<div class="it"><b>全体 ${k} / ${cards.length}</b><div class="pg"><i style="width:${cards.length?k/cards.length*100:0}%"></i></div></div>`;
for(const [c,n] of Object.entries(CATS)){const a=cards.filter(x=>x.c==c),b=a.filter(x=>st[x.id]===1).length;h+=`<div class="it">${n}: ${b} / ${a.length}<div class="pg"><i style="width:${a.length?b/a.length*100:0}%"></i></div></div>`}
return h+`<div class="it"><b>バックアップ</b><textarea id="io" placeholder="書き出し/読み込み用JSON">${esc(io)}</textarea><div class="row"><button onclick="io=JSON.stringify({cards,st});draw()">書き出し</button><button onclick="imp()">読み込み</button></div><div class="row"><button onclick="if(confirm('進捗を消しますか?')){st={};save();draw()}">進捗リセット</button><button onclick="if(confirm('カードを初期状態に戻しますか?(編集内容は消えます)')){cards=D.map((d,i)=>({id:'d'+i,c:d[0],q:d[1],a:d[2],s:d[3],n:d[4]||''}));st={};save();draw()}">初期化</button></div></div>`}
function imp(){try{const o=JSON.parse($('#io').value);if(!Array.isArray(o.cards))throw 0;cards=o.cards;st=o.st||{};save();io='';alert('読み込みました');draw()}catch(e){alert('JSONの形式が正しくありません')}}
rb();
</script></body></html>

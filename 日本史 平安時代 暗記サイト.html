<script>
const RAW=`## 平安時代初期の重要事項
# 桓武天皇の時代
長岡京: 784年に遷都された都。洪水や暗殺事件などのトラブルが多発した
平安京: 794年に遷都された都（現在の京都）。山々に囲まれた守りやすい地形である
山背国（山城国）: 平安京が置かれた場所。山に囲まれた地形から「背」の字が「城」へと変わった
軍団制の廃止: 律令制における兵役制度の見直し
健児（こんでい）の制: 軍団制に代わり、地方の有力者の子弟を兵士として採用する制度
勘解由使（かげゆし）: 797年に設置された令外の官。国司が交代する際に不正がないかを監視する役職
坂上田村麻呂: 征夷大将軍として東北地方の蝦夷（えみし）征討を行った人物
胆沢城（いさわじょう）: 東北支配の拠点として築かれ、鎮守府が移された場所
志波城（しわじょう）: 東北の最前線として築かれた城
徳政相論（徳政論争）: 藤原緒嗣と菅野真道が、軍事（蝦夷征討）と造作（平安京造営）の是非を議論したこと
# 嵯峨天皇の時代
薬子の変（平城太上天皇の変）: 平城太上天皇と藤原薬子らが政権奪還を企てた政争
藤原冬嗣: 嵯峨天皇を支え、権力を握った藤原北家の人物
蔵人所（くろうどどころ）: 天皇の秘書機関として設置された令外の官
検非違使（けびいし）: 京都の治安維持を行う警察的な役職
弘仁格式（こうにんきゃくしき）: 嵯峨天皇の時代に編纂された、律令を補足・施行するための法令（格式）
三代格式: 弘仁格式、貞観格式、延喜格式の総称
## 藤原氏の権力掌握
# 藤原氏の権力掌握術
他氏排斥（たしはいせき）: 藤原氏以外の有力な貴族を事件に巻き込んで失脚させる手法
外戚政策（がいせきせいさく）: 天皇の外祖父（母方の祖父）の立場を利用して権力を振るう手法
摂政（せっしょう）: 天皇が幼少の時に代わって政務を行う職
関白（かんぱく）: 成人した天皇を補佐し、全ての政務に関わる職
# 藤原良房の時代
良房（よしふさ）: 人臣として初めて摂政となった人物
令の義解（りょうのぎげ）: 養老律令の国家による公式な注釈書
承和の変（じょうわのへん）: 842年に藤原良房が橘逸勢や伴健岑を失脚させた事件
応天門の変（おうてんもんのへん）: 866年に有力者・伴善男が放火の疑いで失脚した事件
# 藤原基経と宇多天皇の時代
基経（もとつね）: 初の関白となった人物
阿衡の紛議（あこうのふんぎ）: 887年、関白の地位をめぐり藤原基経と宇多天皇が対立した事件
菅原道真（すがわらのみちざね）: 宇多天皇に登用された学者・官僚
寛平の治（かんぴょうのち）: 藤原氏を外した宇多天皇による政治
遣唐使（けんとうし）の廃止: 894年に菅原道真の提言により停止された
## 平安時代前期に関する重要語句・事項
平安京への遷都: 794年に桓武天皇によって行われた（それ以前の長岡京からの遷都）。
蔵人所 (くろうどどころ): 810年に設置された天皇の機密文書を扱う機関。初代長官（蔵人の頭）は藤原冬嗣。
藤原北家: 藤原冬嗣が属した家系。
薬子の変 (くすこのへん): 平城上皇と藤原薬子、その兄である藤原仲成が画策した平城京への再遷都を狙う事件。
摂政・関白: 藤原氏が天皇の外戚（外祖父など）として権力を振るった地位。最初の摂政は藤原良房、最初の関白は藤原基経。
令外の官 (りょうげのかん): 律令制で定められた役職以外に、後から付け足された役職の総称。
観察使 (かげゆし): 国司の不正を監査するために設置された役職（桓武天皇期）。
検非違使 (けびいし): 都の治安維持のために設置された役職（嵯峨天皇期）。
坂上田村麻呂: 征夷大将軍として東北地方を平定した人物。多賀城の北に伊沢城を築き、鎮守府を置いた。
承和の変 (じょうわのへん): 842年、橘逸勢らが謀反の疑いで配流された事件。
応天門の変 (おうてんもんのへん): 伴善男が排斥された事件。これ以降、藤原良房が正式に摂政に就任した。
阿衡の紛議 (あこうのふんぎ): 藤原基経と宇多天皇の間で起きた政治的対立事件。
遣唐使の廃止: 菅原道真らによって提案・実施された外交方針の転換。
## 醍醐天皇〜村上天皇・承平天慶の乱
# 醍醐天皇と延喜の治
醍醐天皇: 天皇親政を行った人物。
延喜の治: 醍醐天皇による治世。
菅原道真: 藤原氏によって大宰府へ左遷された学者。
大宰権帥: 大宰府の長官職。菅原道真が任じられた役職。
藤原時平: 醍醐天皇の時代に左大臣を務めた人物。
延喜の荘園整理令: 902年に出された、初期荘園や公領などを整理・廃止しようとした法令。律令制の「班田」復活を目指した。
三善清行: 「意見封事十二箇条」を提出し、地方政治の乱れを訴えた人物。
# 承平・天慶の乱
承平・天慶の乱: 平将門の乱と藤原純友の乱の総称。武士による反乱。
平将門の乱: 関東地方（下総国など）を舞台にした反乱。国府を襲撃した。
藤原純友の乱: 瀬戸内海（日振島・伊予国など）を舞台にした反乱。
平貞盛・藤原秀郷: 平将門を鎮圧した人物。
源経基: 藤原純友の乱を鎮圧した人物で、清和源氏の祖。
押領使: 地方の反乱鎮圧を目的とした官職。
# 村上天皇と天暦の治
村上天皇: 醍醐天皇後の天皇親政の時代。
天暦の治: 村上天皇による治世。
乾元大宝: 村上天皇の時代に鋳造された、「皇朝十二銭」の最後にあたる貨幣。
皇朝十二銭: 天皇朝が鋳造した12種類の貨幣の総称（最初：和同開珎）。
## 平安時代後期：藤原氏の全盛期から院政前夜まで
# 藤原氏の全盛期
安和の変: 藤原氏によるライバル排除（他氏排斥）の最後となる事件。源の高明が左遷された。
摂関政治: 摂政・関白が常に置かれる政治体制。藤原道長・頼通の時代に全盛期を迎える。
藤原道長: 摂関政治の全盛期を築いた人物。正式には関白には就任しなかったが、実質的な最高権力者として「望月の歌」で知られる。
刀伊の入寇: 女真族が九州を襲撃した事件。藤原隆家が撃退した。
藤原頼通: 道長の子。約50年にわたり政権を担った。
平忠常の乱: 関東（上総）で起きた反乱。源頼信が鎮圧した。
前九年の合戦: 東北で安倍氏が起こした反乱。源頼義・義家親子が鎮圧した。
平等院鳳凰堂: 藤原頼通が宇治に建立した阿弥陀堂。「宇治殿」とも呼ばれる。
# 後三条・白河天皇の時代
後三条天皇: 藤原氏との外戚関係がない天皇として、久々に天皇親政を行った。
延久の荘園整理令: 藤原氏の経済基盤である荘園を整理し、天皇の権力を強化するための法令。
記録荘園券契所: 荘園整理令を円滑に進めるために設置された専門機関（記録所）。
後三年の合戦: 清原氏の内紛。源義家が清原清衡を助けて鎮圧した。
奥州藤原氏: 53年の合戦で勝利した清衡が東北地方で勢力を築いた一族。平泉を拠点に4代（清衡・基衡・秀衡・泰衡）にわたり繁栄した。
## 平安時代の土地制度と用語
# 平安時代の土地制度と用語
公領 (こうりょう): 荘園以外の、国司が支配する公的な土地。別名「国衙領（こくがりょう）」。
直営田 (じきえいでん): 貴族や大宰府などが公地を勝手に利用した土地。
延喜の荘園整理令 (えんぎのしょうえんせいりれい): 902年、醍醐天皇によって出された、私的な土地利用を禁じて公領へ戻そうとした法令。
班田 (はんでん): 国民に土地を分け与える制度。
浮浪逃亡 (ふろうとうぼう): 農民が土地から逃げ出すこと。
# 10世紀中葉以降の土地制度
名 (みょう): 班田に代わる、ある程度の広さを持つ土地の単位。
田堵 (たと): 名の経営を国司から任された有力農民。
大名田堵 (だいみょうたと): 田堵の中でも、大規模な経営を行う特に有力な農民。
国司 (こくし): 各国の行政官。
郡司・郷司・保司 (ぐんじ・ごうじ・ほうじ): 国司の配下にある役人。
臨時雑役 (りんじぞうやく): この時期に徴収された税の一種。
# 国司の実態と役職名
売官・売位 (ばいかん・ばいい): 官職や地位が金銭で売り買いされること。
成功 (じょうごう): 資材を投じて官職に就くこと（1回目）。
重任 (ちょうにん): 2回目以降、再び資材を投じて同じ国の国司に任命されること。
遥任 (ようにん): 国司が任国に赴任せず、都に留まって代理人を送ること。
受領 (ずりょう): 実際に任国へ赴任する国司。
藤原元命 (ふじわらのもとなが): 徴税が苛烈すぎて、国司として郡司や百姓らに訴えられた人物。
## 荘園・公領制
# 荘園・公領制の概要
荘園公領制: 平安時代から中世にかけての土地制度
公領: 公的な土地
荘園: 私有地
# 荘園の発生と発展
初期荘園: 奈良時代の「墾田永年私財法（743年）」によって発生した私有地
墾田永年私財法: 土地の私有を認める法律
開発領主: 土地を自ら開墾し、所有権を持つ有力農民（大名田堵）
寄進地系荘園: 開発領主が国司の圧力を避けるため、貴族や寺社に土地を寄進して成立した荘園
# 寄進地系荘園の仕組みと権利
寄進: 土地の所有権を都の貴族や寺社に譲り渡すこと
領家: 寄進された土地を受け取る貴族や寺社
本家: さらにその上の権力者
荘園領主: 現地不在の所有者（領家・本家の総称）
召喚: 寄進後も現地で管理を任された元開発領主
名主: 田堵が成長した姿
年貢・公事・夫役: 荘園における租税の種類
不輸の権: 官物（税）の納入を免除される権利
不入の権: 検田使などの役人の立ち入りを拒否できる権利
# 荘園の整理
延久の荘園整理令: 五条天皇が行った、荘園を整理し天皇中心の政治を復活させるための政策
記録荘園券契所: 荘園整理のために設置された役所`;
